name: Sentinel checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sentinel_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U sentinel -d sentinel_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SENTINEL_TEST_DATABASE_URL: postgresql://sentinel:test-only@localhost:5432/sentinel_test
      REDIS_URL: redis://localhost:6379/0
      SENTINEL_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check --select F backend scripts deploy
      - run: python -m ruff format --check --diff backend scripts deploy
      - run: python -m pip_audit -r backend/requirements.txt --no-deps --disable-pip --progress-spinner off
      - run: python -m pytest backend/tests -q --timeout=45 --junitxml=artifacts/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: |
            artifacts/
            !artifacts/alert-certs/**
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: sentinel-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SENTINEL_ACCEPTANCE: '1'
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p artifacts/alert-certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout artifacts/alert-certs/server.key -out artifacts/alert-certs/server.crt -days 1 -subj '/CN=alerts' -addext 'subjectAltName=DNS:alerts'
          python scripts/setup_dev.py
          echo 'SENTINEL_RATE_LIMIT_REQUESTS=5000' >> backend/.env
          docker compose config --quiet
          docker compose up -d --build
      - run: python scripts/container_acceptance.py
      - name: Capture container logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/compose-status.txt
          docker compose logs --no-color --tail 150 > artifacts/compose.log
          docker compose logs --no-color backend1 backend2 | rg "Operations monitor unavailable" | tail -5 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-acceptance
          path: |
            artifacts/
            !artifacts/alert-certs/**
      - run: docker compose down --volumes --remove-orphans
        if: always()

  deployment-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SENTINEL_GATEWAY_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go install sigs.k8s.io/kind@v0.33.0
      - run: kind create cluster --name sentinel-gateway --wait 60s
      - run: helm version --short
      - run: helm install eg oci://docker.io/envoyproxy/gateway-helm --version v1.10.0 -n envoy-gateway-system --create-namespace --wait --timeout 180s
      - run: |
          mkdir -p artifacts
          python deploy/kubernetes/render.py --host sentinel.invalid --backend-image registry.invalid/backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --frontend-image registry.invalid/frontend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb --gateway-image registry.invalid/gateway@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc --output artifacts/deployment.yaml
          python - <<'PYCODE'
          import importlib.util
          import os
          from pathlib import Path
          import subprocess
          spec = importlib.util.spec_from_file_location('render', 'deploy/kubernetes/render.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          resources = module.render('sentinel.invalid', dict.fromkeys(('backend','frontend','gateway'), 'registry.invalid/app@sha256:'+'a'*64))
          config = next(r for r in resources if r['kind']=='ConfigMap' and r['metadata']['name']=='sentinel-gateway-config')
          Path('artifacts/k8s-nginx.conf').write_text(config['data']['nginx.conf'])
          PYCODE
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true --add-host sentinel-api:127.0.0.1 --add-host sentinel-frontend:127.0.0.1 -v "$PWD/artifacts/k8s-nginx.conf:/etc/nginx/nginx.conf:ro" nginxinc/nginx-unprivileged:alpine nginx -t
          kubectl create namespace sentinel
          kubectl apply --dry-run=server -f artifacts/deployment.yaml
          python - <<'PYCODE'
          import os
          import subprocess
          image = subprocess.check_output(['docker','image','inspect','nginxinc/nginx-unprivileged:alpine','--format','{{index .RepoDigests 0}}'],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as handle:
              handle.write('SENTINEL_GATEWAY_FIXTURE_IMAGE='+image+'\n')
          PYCODE
      - run: python scripts/gateway_acceptance.py
      - name: Capture gateway diagnostics
        if: always()
        run: |
          mkdir -p artifacts
          kubectl --context kind-sentinel-gateway get pods -A -o wide > artifacts/gateway-pods.txt || true
          kubectl --context kind-sentinel-gateway -n sentinel-ci-routing get gateway,httproute -o yaml > artifacts/gateway-status.yaml || true
          kubectl --context kind-sentinel-gateway -n envoy-gateway-system logs deployment/envoy-gateway --tail=100 > artifacts/gateway-controller.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-gateway
          path: |
            artifacts/
            !artifacts/gateway-certs/**
      - run: kind delete cluster --name sentinel-gateway
        if: always()
