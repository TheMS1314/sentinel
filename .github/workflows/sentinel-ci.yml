name: Sentinel checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sentinel_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U sentinel -d sentinel_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SENTINEL_TEST_DATABASE_URL: postgresql://sentinel:test-only@localhost:5432/sentinel_test
      REDIS_URL: redis://localhost:6379/0
      SENTINEL_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check --select F backend scripts
      - run: python -m ruff format --check backend scripts
      - run: python -m pip_audit -r backend/requirements.txt --no-deps --disable-pip --progress-spinner off
      - run: python -m pytest backend/tests -q --timeout=45 --junitxml=artifacts/backend.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: |
            artifacts/
            !artifacts/alert-certs/**
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: sentinel-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SENTINEL_ACCEPTANCE: '1'
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          mkdir -p artifacts/alert-certs
          openssl req -x509 -newkey rsa:2048 -nodes -keyout artifacts/alert-certs/server.key -out artifacts/alert-certs/server.crt -days 1 -subj '/CN=alerts' -addext 'subjectAltName=DNS:alerts'
          python scripts/setup_dev.py
          echo 'SENTINEL_RATE_LIMIT_REQUESTS=5000' >> backend/.env
          docker compose config --quiet
          docker compose up -d --build
      - run: python scripts/container_acceptance.py
      - name: Capture container logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps --all > artifacts/compose-status.txt
          docker compose logs --no-color --tail 150 > artifacts/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-acceptance
          path: |
            artifacts/
            !artifacts/alert-certs/**
      - run: docker compose down --volumes --remove-orphans
        if: always()
