services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup_dev.py first}
      POSTGRES_DB: sentinel
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sentinel]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec, --maxmemory, 256mb, --maxmemory-policy, noeviction]
    volumes:
      - sentinel_redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  db-init:
    build: ./backend
    env_file: ./backend/.env
    environment:
      SENTINEL_DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinel
      SENTINEL_MIGRATION_DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD}@postgres:5432/sentinel
      SENTINEL_RUNTIME_DB_PASSWORD: ${SENTINEL_RUNTIME_DB_PASSWORD:?Generate a separate runtime database password}
      SENTINEL_AUTH_BACKEND: database
    command: [python, -m, app.ops.initialize]
    depends_on:
      postgres:
        condition: service_healthy
  backend1: &backend
    build: ./backend
    env_file: ./backend/.env
    environment: &backend-env
      SENTINEL_DATABASE_URL: postgresql://sentinel_runtime:${SENTINEL_RUNTIME_DB_PASSWORD}@postgres:5432/sentinel
      SENTINEL_REQUIRE_RESTRICTED_DB: '1'
      SENTINEL_AUTH_BACKEND: database
      REDIS_URL: redis://redis:6379/0
      QUEUE_BACKEND: postgres
      RATE_LIMIT_BACKEND: redis
      SENTINEL_INSTANCE_ID: backend1
      SENTINEL_REQUIRE_MIGRATIONS: '1'
      SENTINEL_TRUSTED_PROXY_IPS: ${SENTINEL_SUBNET:-172.30.0.0/24}
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 45s
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
  backend2:
    <<: *backend
    environment:
      <<: *backend-env
      SENTINEL_INSTANCE_ID: backend2
  frontend:
    build: ./frontend
    restart: unless-stopped
  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    ports: ['127.0.0.1:8000:8080']
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [backend1, backend2, frontend]
    restart: unless-stopped
volumes:
  sentinel_pgdata:
  sentinel_redisdata:

networks:
  default:
    ipam:
      config:
        - subnet: ${SENTINEL_SUBNET:-172.30.0.0/24}
