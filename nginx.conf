pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 512k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    upstream sentinel_backend {
        zone backend_pool 64k;
        server backend1:8000 resolve max_fails=2 fail_timeout=5s;
        server backend2:8000 resolve max_fails=2 fail_timeout=5s;
        keepalive 16;
    }
    upstream sentinel_frontend {
        zone frontend_pool 64k;
        server frontend:8080 resolve;
    }
    server {
        listen 8080;
        client_body_timeout 10s;
        client_header_timeout 10s;
        keepalive_timeout 10s;
        send_timeout 15s;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        location /api/ {
            proxy_pass http://sentinel_backend/;
            proxy_read_timeout 40s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location = /health { proxy_pass http://sentinel_backend/health/ready; }
        location / { proxy_pass http://sentinel_frontend; }
    }
}
